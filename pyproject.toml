[project]
name = "tcolorize"
version = "0.1.0"
description = "Very simple cross-platform colored terminal text in Python"
readme = "README.md"
authors = [
    { name = "grayphi", email = "" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint>=4.0.9",
    "pytest>=9.1.1",
]
